[package]
name = "x402-chain-hypercore"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "HyperCore (Hyperliquid) chain support for the x402 payment protocol"
readme = "README.md"
publish = false

[package.metadata.docs.rs]
all-features = true

[features]
default = []
telemetry = ["tracing", "x402-types/telemetry"]
facilitator = [
	"async-trait",
	"url",
	"hex",
	"hyperliquid_rust_sdk",
	"alloy",
	"ethers",
	"reqwest",
]
full = ["telemetry", "facilitator"]

[dependencies]
x402-types = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }

url = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
hex = { version = "0.4.3", optional = true }

# HyperCore SDK
hyperliquid_rust_sdk = { git = "https://github.com/edisontim/hyperliquid-rust-sdk", branch = "feat/qol-rebased", optional = true }
alloy = { version = "1.4", features = ["signers"], optional = true }
ethers = { version = "2.0", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }

# Telemetry
tracing = { workspace = true, optional = true }
